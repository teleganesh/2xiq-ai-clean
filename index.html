<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>2xIQ - Professional AI Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', system-ui, sans-serif;
            height: 100vh;
            overflow: hidden;
            background: #0a0a0a;
        }

        /* Professional Dark Theme */
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --border-color: #30363d;
            --accent: #238636;
            --accent-hover: #2ea043;
            --danger: #f85149;
            --danger-hover: #ff7b72;
        }

        body.light-theme {
            --bg-primary: #ffffff;
            --bg-secondary: #f6f8fa;
            --bg-tertiary: #eaeef2;
            --text-primary: #1f2328;
            --text-secondary: #656d76;
            --border-color: #d0d7de;
        }

        .app-container {
            display: flex;
            height: 100vh;
            background: var(--bg-primary);
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .brand {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }

        .brand span {
            color: var(--accent);
        }

        .new-chat-btn {
            width: 100%;
            padding: 10px 16px;
            background: var(--accent);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            cursor: pointer;
            margin: 16px 0 12px;
            transition: background 0.2s;
        }

        .new-chat-btn:hover {
            background: var(--accent-hover);
        }

        .switch-model-btn {
            width: 100%;
            padding: 10px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .switch-model-btn:hover {
            background: var(--border-color);
        }

        .conversations-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .conversation-item {
            padding: 10px 12px;
            margin-bottom: 6px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-secondary);
            font-size: 14px;
            position: relative;
        }

        .conversation-item:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .conversation-item.active {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .delete-conv {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0;
            transition: opacity 0.2s;
            color: var(--danger);
            cursor: pointer;
            font-size: 12px;
        }

        .conversation-item:hover .delete-conv {
            opacity: 1;
        }

        .sidebar-footer {
            padding: 20px;
            border-top: 1px solid var(--border-color);
        }

        .settings-footer-btn {
            width: 100%;
            padding: 10px;
            background: var(--bg-tertiary);
            border: none;
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
        }

        .settings-footer-btn:hover {
            background: var(--border-color);
            color: var(--text-primary);
        }

        /* Main Chat */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            min-width: 0;
        }

        .chat-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .model-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 14px;
            background: var(--bg-tertiary);
            border-radius: 20px;
            font-size: 13px;
            color: var(--text-primary);
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        .message-wrapper {
            max-width: 800px;
            margin: 0 auto;
        }

        .message {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 18px;
            background: var(--bg-tertiary);
        }

        .user-message .message-avatar {
            background: var(--accent);
        }

        .message-content {
            flex: 1;
            line-height: 1.6;
            color: var(--text-primary);
            font-size: 14px;
            overflow-wrap: break-word;
            word-wrap: break-word;
        }

        .message-content pre {
            background: var(--bg-secondary);
            border-radius: 8px;
            padding: 16px;
            overflow-x: auto;
            margin: 12px 0;
        }

        .message-content code {
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 13px;
        }

        /* Input Area */
        .input-area {
            padding: 20px 24px;
            border-top: 1px solid var(--border-color);
            background: var(--bg-primary);
        }

        .input-container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
        }

        textarea {
            width: 100%;
            background: transparent;
            border: none;
            padding: 14px 16px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 14px;
            resize: none;
            outline: none;
        }

        .input-actions {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px 12px;
            border-top: 1px solid var(--border-color);
        }

        .file-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .file-btn, .send-button {
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            border: none;
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .file-btn:hover, .send-button:hover {
            background: var(--border-color);
            color: var(--text-primary);
        }

        .send-button {
            background: var(--accent);
            color: white;
        }

        .send-button:hover {
            background: var(--accent-hover);
        }

        /* Settings Overlay */
        .settings-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .settings-overlay.active {
            display: flex;
        }

        .settings-popup {
            background: var(--bg-secondary);
            border-radius: 16px;
            width: 400px;
            max-width: 90%;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            animation: slideUp 0.2s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .settings-popup-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .settings-popup-header h3 {
            color: var(--text-primary);
            font-weight: 600;
        }

        .close-popup {
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 24px;
            line-height: 1;
        }

        .close-popup:hover {
            color: var(--text-primary);
        }

        .settings-popup-section {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .settings-popup-section h4 {
            color: var(--text-secondary);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
        }

        .theme-option {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            cursor: pointer;
            color: var(--text-primary);
        }

        .theme-option:hover {
            color: var(--accent);
        }

        .profile-info {
            margin-top: 16px;
        }

        .profile-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            color: var(--text-primary);
            font-size: 14px;
        }

        .logout-btn, .delete-btn {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            margin-top: 12px;
        }

        .logout-btn {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .logout-btn:hover {
            background: var(--border-color);
        }

        .delete-btn {
            background: var(--danger);
            color: white;
        }

        .delete-btn:hover {
            background: var(--danger-hover);
        }

        /* Login Modal */
        .login-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-modal.hidden {
            display: none;
        }

        .login-card {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 40px;
            width: 400px;
            max-width: 90%;
            border: 1px solid var(--border-color);
        }

        .login-card h2 {
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .login-input {
            width: 100%;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 14px;
            margin: 12px 0;
            color: var(--text-primary);
            font-size: 14px;
        }

        .login-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .login-btn {
            width: 100%;
            background: var(--accent);
            border: none;
            color: white;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            margin-top: 8px;
        }

        .auth-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .auth-tab {
            flex: 1;
            padding: 10px;
            background: var(--bg-tertiary);
            border: none;
            color: var(--text-secondary);
            border-radius: 8px;
            cursor: pointer;
        }

        .auth-tab.active {
            background: var(--accent);
            color: white;
        }

        /* Model Modal */
        .model-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .model-modal.hidden {
            display: none;
        }

        .model-card {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 32px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid var(--border-color);
        }

        .model-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin: 24px 0;
        }

        .model-option {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .model-option:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .model-icon {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .model-name {
            color: var(--text-primary);
            font-weight: 600;
            margin-bottom: 4px;
        }

        .model-provider {
            color: var(--text-secondary);
            font-size: 12px;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        .thinking-container {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 16px 20px;
            background: var(--bg-tertiary);
            border-radius: 12px;
        }

        .thinking-dots {
            display: flex;
            gap: 6px;
        }

        .thinking-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-secondary);
            animation: dotPulse 1.4s ease-in-out infinite;
        }

        @keyframes dotPulse {
            0%, 60%, 100% { opacity: 0.3; transform: scale(0.8); }
            30% { opacity: 1; transform: scale(1.2); }
        }

        .scroll-to-bottom {
            position: fixed;
            bottom: 100px;
            right: 30px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .scroll-to-bottom.visible {
            opacity: 1;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: -280px;
                transition: left 0.3s ease;
                z-index: 100;
                height: 100%;
            }
            
            .sidebar.open {
                left: 0;
            }
            
            .menu-toggle {
                display: block;
                cursor: pointer;
                font-size: 24px;
                margin-right: 16px;
            }
            
            .file-buttons {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>

<!-- Login Modal -->
<div class="login-modal" id="loginModal">
    <div class="login-card">
        <h2>2x<span style="color: var(--accent);">IQ</span></h2>
        <p style="color: var(--text-secondary); margin-bottom: 24px;">Professional AI Assistant</p>
        <div class="auth-tabs">
            <button class="auth-tab active" onclick="switchAuthTab('login')">Sign In</button>
            <button class="auth-tab" onclick="switchAuthTab('signup')">Sign Up</button>
        </div>
        <div id="loginForm">
            <input type="email" id="loginEmail" class="login-input" placeholder="Email">
            <input type="password" id="loginPassword" class="login-input" placeholder="Password">
            <button class="login-btn" onclick="handleLogin()">Sign In</button>
        </div>
        <div id="signupForm" style="display: none;">
            <input type="text" id="signupName" class="login-input" placeholder="Full name">
            <input type="email" id="signupEmail" class="login-input" placeholder="Email">
            <input type="password" id="signupPassword" class="login-input" placeholder="Password">
            <input type="password" id="signupConfirmPassword" class="login-input" placeholder="Confirm password">
            <button class="login-btn" onclick="handleSignup()">Create Account</button>
        </div>
        <div id="loginError" style="color: var(--danger); margin-top: 16px; font-size: 13px;"></div>
    </div>
</div>

<!-- Model Modal -->
<div class="model-modal" id="modelModal">
    <div class="model-card">
        <h3 style="color: var(--text-primary); text-align: center;">Choose AI Model</h3>
        <div id="modelGridContainer"></div>
        <button class="new-chat-btn" id="startChatBtn" style="margin: 0;">Launch</button>
    </div>
</div>

<!-- Main App -->
<div id="appContent" style="display: none;">
<div class="app-container">
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="brand">2x<span>IQ</span></div>
            <button class="new-chat-btn" id="newChatBtn">+ New Conversation</button>
            <button class="switch-model-btn" id="switchModelBtn">Switch Model</button>
        </div>
        <div class="conversations-list" id="conversationsList"></div>
        <div class="sidebar-footer">
            <button class="settings-footer-btn" onclick="openSettingsPopup()">
                ⚙️ Settings
            </button>
        </div>
    </div>

    <div class="main-chat">
        <div class="chat-header">
            <div style="display: flex; align-items: center; gap: 16px;">
                <div class="menu-toggle" style="display: none; cursor: pointer; font-size: 24px; color: var(--text-secondary);" onclick="toggleSidebar()">☰</div>
                <div class="model-badge">
                    <span id="selectedModelIcon">🚀</span>
                    <span id="selectedModelName">GPT-oss-120b</span>
                </div>
            </div>
        </div>

        <div class="messages-container" id="messagesContainer">
            <div id="centerContent" style="display: flex; align-items: center; justify-content: center; height: 100%;">
                <div style="text-align: center;">
                    <div style="font-size: 48px; margin-bottom: 16px;">✨</div>
                    <h3 style="color: var(--text-primary);">Welcome to 2xIQ</h3>
                    <p style="color: var(--text-secondary); margin-top: 8px;">Upload files, images, or start chatting</p>
                </div>
            </div>
            <div class="message-wrapper" id="messageWrapper" style="display: none;"></div>
        </div>

        <div class="input-area">
            <div class="input-container">
                <textarea id="messageInput" placeholder="Ask me anything... (Enter to send)" rows="1"></textarea>
                <div class="input-actions">
                    <div class="file-buttons">
                        <label class="file-btn" for="imageUpload">📷 Image</label>
                        <input type="file" id="imageUpload" accept="image/*" style="display: none;">
                        <label class="file-btn" for="fileUpload">📎 File</label>
                        <input type="file" id="fileUpload" accept=".txt,.json,.js,.py,.html,.css" style="display: none;">
                    </div>
                    <button class="send-button" id="sendButton">Send</button>
                </div>
            </div>
        </div>
    </div>
</div>
</div>

<!-- Settings Overlay Popup -->
<div class="settings-overlay" id="settingsOverlay" onclick="closeSettingsPopup(event)">
    <div class="settings-popup" onclick="event.stopPropagation()">
        <div class="settings-popup-header">
            <h3>Settings</h3>
            <span class="close-popup" onclick="closeSettingsPopup()">✕</span>
        </div>
        <div class="settings-popup-section">
            <h4>Profile</h4>
            <div class="profile-info">
                <div class="profile-row">
                    <span>Name</span>
                    <span id="profileName">User</span>
                </div>
                <div class="profile-row">
                    <span>Email</span>
                    <span id="profileEmail">user@example.com</span>
                </div>
                <div class="profile-row">
                    <span>Member since</span>
                    <span id="profileJoined">Today</span>
                </div>
            </div>
        </div>
        <div class="settings-popup-section">
            <h4>Appearance</h4>
            <div class="theme-option" onclick="setTheme('dark')">
                <span>🌙 Dark Mode</span>
                <span id="darkCheck">✓</span>
            </div>
            <div class="theme-option" onclick="setTheme('light')">
                <span>☀️ Light Mode</span>
                <span id="lightCheck"></span>
            </div>
        </div>
        <div class="settings-popup-section">
            <button class="logout-btn" onclick="logout()">Logout</button>
            <button class="delete-btn" onclick="deleteAccount()">Delete Account</button>
        </div>
    </div>
</div>

<div class="scroll-to-bottom" id="scrollToBottomBtn" onclick="scrollToBottom()">↓</div>

<script>
    // Working Free Models
    const MODEL_CATEGORIES = {
        "🤖 AI Models": [
            { id: "openai/gpt-oss-120b:free", name: "GPT-oss-120b", icon: "🚀", provider: "OpenAI" },
            { id: "google/gemma-4-31b-it:free", name: "Gemma 4 31B", icon: "🔴", provider: "Google" }
        ]
    };

    let allModels = [];
    for (const category in MODEL_CATEGORIES) {
        allModels = allModels.concat(MODEL_CATEGORIES[category]);
    }

    let selectedModel = allModels[0];
    let currentUser = null;
    let authToken = null;
    let currentConversation = null;
    let conversations = [];
    let isLoading = false;
    let hasMessages = false;
    let currentImage = null;
    let currentFile = null;

    // Auth Functions
    function switchAuthTab(tab) {
        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');
        const tabs = document.querySelectorAll('.auth-tab');
        
        if (tab === 'login') {
            loginForm.style.display = 'block';
            signupForm.style.display = 'none';
            tabs[0].classList.add('active');
            tabs[1].classList.remove('active');
        } else {
            loginForm.style.display = 'none';
            signupForm.style.display = 'block';
            tabs[1].classList.add('active');
            tabs[0].classList.remove('active');
        }
        document.getElementById('loginError').innerText = '';
    }

    async function handleSignup() {
        const name = document.getElementById('signupName').value;
        const email = document.getElementById('signupEmail').value;
        const password = document.getElementById('signupPassword').value;
        const confirm = document.getElementById('signupConfirmPassword').value;
        
        if (!name || !email || !password) {
            document.getElementById('loginError').innerText = 'Please fill all fields';
            return;
        }
        if (password !== confirm) {
            document.getElementById('loginError').innerText = 'Passwords do not match';
            return;
        }
        
        try {
            const res = await fetch('/api/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password })
            });
            const data = await res.json();
            if (res.ok) {
                authToken = data.token;
                currentUser = data.user;
                localStorage.setItem('token', authToken);
                document.getElementById('loginModal').classList.add('hidden');
                document.getElementById('appContent').style.display = 'block';
                showModelSelection();
            } else {
                document.getElementById('loginError').innerText = data.error || 'Signup failed';
            }
        } catch (err) {
            document.getElementById('loginError').innerText = 'Network error. Please try again.';
        }
    }

    async function handleLogin() {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        if (!email || !password) {
            document.getElementById('loginError').innerText = 'Please fill all fields';
            return;
        }
        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            if (res.ok) {
                authToken = data.token;
                currentUser = data.user;
                localStorage.setItem('token', authToken);
                document.getElementById('loginModal').classList.add('hidden');
                document.getElementById('appContent').style.display = 'block';
                showModelSelection();
            } else {
                document.getElementById('loginError').innerText = data.error || 'Invalid credentials';
            }
        } catch (err) {
            document.getElementById('loginError').innerText = 'Network error. Please try again.';
        }
    }

    function logout() {
        localStorage.removeItem('token');
        authToken = null;
        currentUser = null;
        document.getElementById('loginModal').classList.remove('hidden');
        document.getElementById('appContent').style.display = 'none';
        closeSettingsPopup();
    }

    async function deleteAccount() {
        if (!confirm('Are you sure? This will permanently delete your account.')) return;
        try {
            const res = await fetch('/api/user', {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${authToken}` }
            });
            if (res.ok) {
                logout();
                alert('Account deleted successfully');
            } else {
                alert('Failed to delete account');
            }
        } catch (err) {
            alert('Network error');
        }
    }

    // Settings Popup
    function openSettingsPopup() {
        if (currentUser) {
            document.getElementById('profileName').innerText = currentUser.name || 'User';
            document.getElementById('profileEmail').innerText = currentUser.email || 'user@example.com';
        }
        document.getElementById('profileJoined').innerText = new Date().toLocaleDateString();
        document.getElementById('settingsOverlay').classList.add('active');
    }

    function closeSettingsPopup(event) {
        if (!event || event.target === document.getElementById('settingsOverlay') || !event) {
            document.getElementById('settingsOverlay').classList.remove('active');
        }
    }

    function setTheme(theme) {
        if (theme === 'dark') {
            document.body.classList.remove('light-theme');
        } else {
            document.body.classList.add('light-theme');
        }
        localStorage.setItem('theme', theme);
        closeSettingsPopup();
    }

    function loadTheme() {
        const saved = localStorage.getItem('theme') || 'dark';
        setTheme(saved);
    }

    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
    }

    // Model Functions
    function renderModelGrid() {
        const container = document.getElementById('modelGridContainer');
        let html = '<div class="model-grid">';
        for (const model of allModels) {
            html += `<div class="model-option" onclick="selectAndStartModel('${model.id}')">
                <div class="model-icon">${model.icon}</div>
                <div class="model-name">${model.name}</div>
                <div class="model-provider">${model.provider}</div>
            </div>`;
        }
        html += '</div>';
        container.innerHTML = html;
    }

    function selectAndStartModel(modelId) {
        selectedModel = allModels.find(m => m.id === modelId);
        if (!selectedModel) selectedModel = allModels[0];
        document.getElementById('selectedModelIcon').textContent = selectedModel.icon;
        document.getElementById('selectedModelName').textContent = selectedModel.name;
        document.getElementById('modelModal').classList.add('hidden');
        initConversations();
    }

    function showModelSelection() {
        document.getElementById('modelModal').classList.remove('hidden');
        renderModelGrid();
    }

    // Chat Functions
    function initConversations() {
        const saved = localStorage.getItem(`2xiq_conversations_${selectedModel.id}`);
        conversations = saved ? JSON.parse(saved) : [];
        if (conversations.length === 0) createNewChat();
        else { currentConversation = conversations[0]; renderConversations(); renderMessages(); }
    }

    function createNewChat() {
        const newChat = { id: Date.now(), name: 'New Conversation', messages: [] };
        conversations.unshift(newChat);
        currentConversation = newChat;
        hasMessages = false;
        saveConversations();
        renderConversations();
        renderMessages();
    }

    function saveConversations() {
        localStorage.setItem(`2xiq_conversations_${selectedModel.id}`, JSON.stringify(conversations));
    }

    function renderConversations() {
        const container = document.getElementById('conversationsList');
        if (!container) return;
        container.innerHTML = conversations.map(conv => `<div class="conversation-item ${currentConversation?.id === conv.id ? 'active' : ''}" onclick="switchConversation(${conv.id})">
            💬 ${conv.name.length > 25 ? conv.name.substring(0,25)+'...' : conv.name}
            <span class="delete-conv" onclick="event.stopPropagation(); deleteConversation(${conv.id})">🗑️</span>
        </div>`).join('');
    }

    function switchConversation(id) {
        currentConversation = conversations.find(c => c.id === id);
        renderConversations();
        renderMessages();
    }

    function deleteConversation(id) {
        conversations = conversations.filter(c => c.id !== id);
        if (currentConversation && currentConversation.id === id) {
            currentConversation = conversations[0] || null;
        }
        if (!currentConversation && conversations.length === 0) createNewChat();
        saveConversations();
        renderConversations();
        renderMessages();
    }

    function renderMessages() {
        const wrapper = document.getElementById('messageWrapper');
        const center = document.getElementById('centerContent');
        if (!currentConversation || currentConversation.messages.length === 0) {
            if (wrapper) wrapper.style.display = 'none';
            if (center) center.style.display = 'flex';
            return;
        }
        if (wrapper) wrapper.style.display = 'block';
        if (center) center.style.display = 'none';
        hasMessages = true;
        wrapper.innerHTML = currentConversation.messages.map(msg => {
            const isUser = msg.role === 'user';
            return `<div class="message ${isUser ? 'user-message' : 'assistant-message'}">
                <div class="message-avatar">${isUser ? '👤' : selectedModel.icon}</div>
                <div class="message-content">${isUser ? escapeHtml(msg.content) : marked.parse(msg.content)}</div>
            </div>`;
        }).join('');
        document.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
        setTimeout(scrollToBottom, 100);
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }

    function showLoading() {
        const wrapper = document.getElementById('messageWrapper');
        if (!wrapper) return;
        const div = document.createElement('div');
        div.className = 'message assistant-message';
        div.id = 'loadingMessage';
        div.innerHTML = `<div class="thinking-container"><div class="thinking-dots"><div class="thinking-dot"></div><div class="thinking-dot"></div><div class="thinking-dot"></div></div><div>2xIQ is thinking...</div></div>`;
        wrapper.appendChild(div);
        scrollToBottom();
    }

    function hideLoading() {
        document.getElementById('loadingMessage')?.remove();
    }

    async function callAPI(messages) {
        const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ model: selectedModel.id, messages, max_tokens: 2000, temperature: 0.7 })
        });
        if (!res.ok) throw new Error(`API Error: ${res.status}`);
        const data = await res.json();
        return data.choices[0].message.content;
    }

    function buildApiMessages() {
        return currentConversation.messages.filter(m => m.role !== 'system').map(m => ({ role: m.role, content: m.content }));
    }

    async function sendMessage() {
        if (isLoading) return;
        const input = document.getElementById('messageInput');
        const message = input.value.trim();
        if (!message && !currentImage && !currentFile) return;
        input.value = '';
        if (!currentConversation) createNewChat();
        
        const userMsg = { role: 'user', content: message || "Here's my file:" };
        if (currentImage) userMsg.images = [currentImage];
        if (currentFile) { userMsg.fileName = currentFile.name; userMsg.fileContent = currentFile.content; }
        currentConversation.messages.push(userMsg);
        if (currentConversation.messages.length === 1 && message) currentConversation.name = message.substring(0, 30);
        saveConversations();
        renderMessages();
        
        const imageCopy = currentImage, fileCopy = currentFile;
        currentImage = null;
        currentFile = null;
        isLoading = true;
        showLoading();
        
        try {
            let fullMsg = message || "I've uploaded a file";
            if (imageCopy) fullMsg += " [Image uploaded]";
            if (fileCopy) fullMsg += `\n\nFile: ${fileCopy.name}\nContent:\n${fileCopy.content.substring(0, 2000)}`;
            const apiMessages = buildApiMessages();
            if (apiMessages.length && apiMessages[apiMessages.length-1].role === 'user') {
                apiMessages[apiMessages.length-1].content = fullMsg;
            }
            const reply = await callAPI(apiMessages);
            hideLoading();
            currentConversation.messages.push({ role: 'assistant', content: reply });
            saveConversations();
            renderMessages();
        } catch (error) {
            hideLoading();
            currentConversation.messages.push({ role: 'assistant', content: `❌ Error: ${error.message}` });
            renderMessages();
        } finally {
            isLoading = false;
            input.focus();
        }
    }

    function scrollToBottom() {
        const container = document.getElementById('messagesContainer');
        if (container) container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
    }

    // Adjust menu toggle for mobile
    function checkMobile() {
        const menuToggle = document.querySelector('.menu-toggle');
        if (window.innerWidth <= 768) {
            if (menuToggle) menuToggle.style.display = 'block';
        } else {
            if (menuToggle) menuToggle.style.display = 'none';
            document.getElementById('sidebar').classList.remove('open');
        }
    }

    // Event Listeners
    document.getElementById('imageUpload')?.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                currentImage = event.target.result;
                currentFile = null;
                document.getElementById('messageInput').value = `📷 Image: ${file.name}\n\n`;
            };
            reader.readAsDataURL(file);
        }
    });

    document.getElementById('fileUpload')?.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                currentFile = { name: file.name, content: event.target.result };
                currentImage = null;
                document.getElementById('messageInput').value = `📎 File: ${file.name}\n\n`;
            };
            reader.readAsText(file);
        }
    });

    document.getElementById('sendButton')?.addEventListener('click', sendMessage);
    document.getElementById('messageInput')?.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });
    document.getElementById('newChatBtn')?.addEventListener('click', createNewChat);
    document.getElementById('switchModelBtn')?.addEventListener('click', () => {
        document.getElementById('modelModal').classList.remove('hidden');
        renderModelGrid();
    });
    document.getElementById('startChatBtn')?.addEventListener('click', () => {
        if (selectedModel) selectAndStartModel(selectedModel.id);
    });
    document.getElementById('messagesContainer')?.addEventListener('scroll', () => {
        const container = document.getElementById('messagesContainer');
        const btn = document.getElementById('scrollToBottomBtn');
        if (container && btn) {
            const nearBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 100;
            btn.classList.toggle('visible', !nearBottom && hasMessages);
        }
    });

    window.addEventListener('resize', checkMobile);
    
    // Initialize
    loadTheme();
    checkMobile();
    const token = localStorage.getItem('token');
    if (token) {
        authToken = token;
        document.getElementById('loginModal').classList.add('hidden');
        document.getElementById('appContent').style.display = 'block';
        showModelSelection();
    }
</script>
</body>
</html>
